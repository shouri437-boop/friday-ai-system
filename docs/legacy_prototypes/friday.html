<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>F.R.I.D.A.Y — Core Interface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0412;
    --bg-2: #12081d;
    --cyan: #ffc3ea;
    --cyan-soft: #d688d6;
    --cyan-dim: #4a1f52;
    --cyan-glow: rgba(255, 195, 234, 0.35);
    --text: #d9f8ff;
    --text-dim: #5c8a93;
    --menu-radius: clamp(130px, 27vw, 250px);
  }
 
  * { margin:0; padding:0; box-sizing:border-box; }
 
  html, body {
    width:100%; height:100%;
    background:
      radial-gradient(ellipse at 50% 32%, #1f0a2e 0%, #12071f 42%, #050210 75%, #000000 100%),
      radial-gradient(ellipse at 85% 92%, rgba(30,22,95,0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 8% 88%, rgba(74,20,70,0.4) 0%, transparent 55%);
    background-color: #05020c;
    overflow:hidden;
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
  }
 
  #bg-grid{
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(214,136,214,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(214,136,214,0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.9) 0%, transparent 68%);
    pointer-events:none;
  }
 
  canvas#core-canvas{
    position:fixed; inset:0;
    display:block;
    cursor: pointer;
  }
 
  #ground-shadow{
    position:fixed;
    left:50%; top: 68%;
    width: min(46vw, 420px);
    height: 46px;
    background: radial-gradient(ellipse at center, rgba(255,195,234,0.26) 0%, rgba(198,110,220,0.1) 55%, transparent 75%);
    filter: blur(2px);
    transform: translate(-50%, -50%) scale(1);
    pointer-events:none;
    transition: opacity 0.6s ease;
    z-index:1;
  }
 
  /* ---------- HUD overlay ---------- */
  .hud-overlay{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    z-index:5;
  }
 
  .menu-ring{
    position:relative;
    width: 1px; height: 1px;
  }
 
  .center-text{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    pointer-events:none;
  }
 
  .center-text .core-label{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: clamp(1.6rem, 4.4vw, 2.6rem);
    letter-spacing: 0.42em;
    color: var(--text);
    text-shadow: 0 0 18px var(--cyan-glow), 0 0 44px rgba(198,110,220,0.22);
    margin-left: 0.42em; /* optical centering for letter-spacing */
  }
 
  .center-text .core-sub{
    margin-top: 0.9rem;
    font-family:'Rajdhani', sans-serif;
    font-size: clamp(0.62rem, 1.3vw, 0.78rem);
    letter-spacing: 0.32em;
    color: var(--text-dim);
    font-weight:600;
    transition: opacity 0.4s ease;
  }
 
  .core-sub.blink{ animation: blinkFade 2.6s ease-in-out infinite; }
  @keyframes blinkFade{ 0%,100%{opacity:0.35;} 50%{opacity:0.95;} }
 
  /* ---------- connecting lines ---------- */
  .line{
    position:absolute;
    left:50%; top:50%;
    width:1px;
    height: var(--menu-radius);
    transform-origin: top center;
    background: linear-gradient(to bottom, rgba(255,195,234,0) 0%, rgba(214,136,214,0.55) 55%, rgba(255,195,234,0.85) 100%);
    opacity:0;
    transition: opacity 0.7s ease, height 0.7s cubic-bezier(.2,.8,.3,1);
    pointer-events:none;
  }
  .line.top{ transform: translate(-50%,0) rotate(180deg); }
  .line.br{  transform: translate(-50%,0) rotate(60deg); }
  .line.bl{  transform: translate(-50%,0) rotate(-60deg); }
 
  body.active .line{ opacity:1; }
 
  /* ---------- option nodes ---------- */
  .node{
    position:absolute;
    left:50%; top:50%;
    width: clamp(96px, 15vw, 140px);
    padding: 0.9rem 0.4rem;
    text-align:center;
    border: 1px solid var(--cyan-dim);
    background: linear-gradient(180deg, rgba(9,26,32,0.55), rgba(3,10,14,0.55));
    backdrop-filter: blur(3px);
    clip-path: polygon(12% 0, 88% 0, 100% 30%, 100% 100%, 0 100%, 0 30%);
    opacity:0;
    scale:0.7;
    pointer-events:none;
    transition: opacity 0.55s ease, scale 0.55s cubic-bezier(.2,.8,.3,1), border-color 0.3s ease, background 0.3s ease;
    cursor:pointer;
  }
  .node-top{ transform: translate(-50%, calc(-50% - var(--menu-radius))); }
  .node-br { transform: translate(calc(-50% + var(--menu-radius) * 0.866), calc(-50% + var(--menu-radius) * 0.5)); }
  .node-bl { transform: translate(calc(-50% - var(--menu-radius) * 0.866), calc(-50% + var(--menu-radius) * 0.5)); }
 
  body.active .node{ opacity:1; scale:1; pointer-events:auto; }
 
  .node .node-index{
    display:block;
    font-family:'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--cyan-soft);
    opacity:0.7;
    margin-bottom: 0.35rem;
  }
  .node .node-label{
    display:block;
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: clamp(0.72rem, 1.5vw, 0.92rem);
    letter-spacing: 0.12em;
    color: var(--text);
  }
 
  .node:hover, .node.selected{
    border-color: var(--cyan);
    background: linear-gradient(180deg, rgba(20,60,70,0.65), rgba(5,16,20,0.65));
    box-shadow: 0 0 24px rgba(255,195,234,0.25), inset 0 0 18px rgba(214,136,214,0.12);
  }
  .node:hover .node-label, .node.selected .node-label{
    text-shadow: 0 0 12px var(--cyan-glow);
  }
 
  /* ---------- corner HUD chrome ---------- */
  .chrome{
    position:fixed;
    font-family:'Rajdhani', sans-serif;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    color: var(--text-dim);
    z-index:6;
    pointer-events:none;
    user-select:none;
  }
  .chrome b{ color: var(--cyan-soft); font-weight:600; }
  .chrome.tl{ top: 24px; left: 26px; }
  .chrome.tr{ top: 24px; right: 26px; text-align:right; }
  .chrome.bl{ bottom: 22px; left: 26px; }
  .chrome.br{ bottom: 22px; right: 26px; text-align:right; }
 
  .bracket{
    position:fixed;
    width: 34px; height: 34px;
    border: 1px solid rgba(214,136,214,0.32);
    z-index:6;
    pointer-events:none;
  }
  .bracket.tl{ top:16px; left:16px; border-right:none; border-bottom:none; }
  .bracket.tr{ top:16px; right:16px; border-left:none; border-bottom:none; }
  .bracket.bl{ bottom:16px; left:16px; border-right:none; border-top:none; }
  .bracket.br{ bottom:16px; right:16px; border-left:none; border-top:none; }
 
  @media (prefers-reduced-motion: reduce){
    .core-sub.blink{ animation:none; opacity:0.7; }
  }

  /* ---------- left side panel ---------- */
  .side-panel{
    position:fixed;
    left: 26px;
    top: 92px;
    display:flex;
    flex-direction:column;
    gap: 14px;
    z-index:6;
  }

  .side-btn{
    display:flex;
    align-items:center;
    gap: 0.7rem;
    padding: 0.75rem 1.3rem 0.75rem 1rem;
    border: 1px solid var(--cyan-dim);
    background: linear-gradient(180deg, rgba(9,26,32,0.45), rgba(3,10,14,0.45));
    backdrop-filter: blur(3px);
    clip-path: polygon(0 0, 100% 0, 100% 70%, 88% 100%, 0 100%);
    cursor:pointer;
    pointer-events:auto;
    transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;
  }

  .side-btn::before{
    content:'';
    width: 6px; height: 6px;
    border-radius:50%;
    background: var(--cyan-soft);
    box-shadow: 0 0 8px var(--cyan-glow);
    flex-shrink:0;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }

  .side-btn .side-label{
    font-family:'Orbitron', sans-serif;
    font-weight:700;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    color: var(--text);
    white-space:nowrap;
  }

  .side-btn:hover, .side-btn.selected{
    border-color: var(--cyan);
    background: linear-gradient(180deg, rgba(20,60,70,0.55), rgba(5,16,20,0.55));
    box-shadow: 0 0 20px rgba(255,195,234,0.18), inset 0 0 14px rgba(214,136,214,0.1);
    transform: translateX(4px);
  }

  .side-btn:hover .side-label, .side-btn.selected .side-label{
    text-shadow: 0 0 10px var(--cyan-glow);
  }

  .side-btn:hover::before, .side-btn.selected::before{
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
  }

  @media (max-width: 640px){
    .side-panel{ left: 14px; top: 78px; gap: 10px; }
    .side-btn{ padding: 0.6rem 1rem 0.6rem 0.8rem; }
    .side-btn .side-label{ font-size: 0.62rem; }
  }
</style>
</head>
<body>
 
  <div id="bg-grid"></div>
  <canvas id="core-canvas"></canvas>
  <div id="ground-shadow"></div>
 
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>
 
  <div class="chrome tl">F.R.I.D.A.Y <b>OS</b><br>BUILD 4.6.0</div>
  <div class="chrome tr" id="clock">00:00:00<br><span style="opacity:0.6">SYS. <b>ONLINE</b></span></div>
  <div class="chrome bl">CORE STATUS<br><b id="core-status">STANDBY</b></div>
  <div class="chrome br">MODULES LINKED<br><b id="modules-linked">0 / 3</b></div>

  <div class="side-panel">
    <div class="side-btn" data-panel="settings">
      <span class="side-label">SETTINGS</span>
    </div>
    <div class="side-btn" data-panel="tasks">
      <span class="side-label">TASKS</span>
    </div>
  </div>
 
  <div class="hud-overlay">
    <div class="menu-ring">
 
      <div class="line top"></div>
      <div class="line br"></div>
      <div class="line bl"></div>
 
      <div class="node node-top" data-name="MASTER AI">
        <span class="node-index">MODULE 01</span>
        <span class="node-label">MASTER AI</span>
      </div>
      <div class="node node-br" data-name="VISION AI">
        <span class="node-index">MODULE 02</span>
        <span class="node-label">VISION AI</span>
      </div>
      <div class="node node-bl" data-name="CAMPUS AI">
        <span class="node-index">MODULE 03</span>
        <span class="node-label">CAMPUS AI</span>
      </div>
 
      <div class="center-text">
        <div class="core-label">FRIDAY</div>
        <div class="core-sub blink" id="core-sub">TAP THE CORE TO INITIALIZE</div>
      </div>
 
    </div>
  </div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
 
  // ---------------- Three.js scene ----------------
  const canvas = document.getElementById('core-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
 
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 6.2);
 
  const coreGroup = new THREE.Group();
  scene.add(coreGroup);
 
  // Fibonacci sphere distribution for even sprinkle of dots
  const COUNT = 2600;
  const BASE_RADIUS = 1.6;
  const positions = new Float32Array(COUNT * 3);
  const colors = new Float32Array(COUNT * 3);
  const baseDirs = new Float32Array(COUNT * 3);
  const phases = new Float32Array(COUNT);
 
  const offset = 2 / COUNT;
  const increment = Math.PI * (3 - Math.sqrt(5));
 
  for (let i = 0; i < COUNT; i++){
    const y = (i * offset) - 1 + (offset / 2);
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const phi = (i % COUNT) * increment;
    const x = Math.cos(phi) * r;
    const z = Math.sin(phi) * r;
 
    baseDirs[i*3]   = x;
    baseDirs[i*3+1] = y;
    baseDirs[i*3+2] = z;
 
    positions[i*3]   = x * BASE_RADIUS;
    positions[i*3+1] = y * BASE_RADIUS;
    positions[i*3+2] = z * BASE_RADIUS;
 
    // pinkish-white with subtle variance in lightness/saturation for depth/sparkle
    const light = 0.78 + Math.random() * 0.2;
    const sat = 0.25 + Math.random() * 0.3;
    const c = new THREE.Color();
    c.setHSL(0.92, sat, light);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
 
    phases[i] = Math.random() * Math.PI * 2;
  }
 
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
 
  const material = new THREE.PointsMaterial({
    size: 0.05,
    vertexColors: true,
    transparent: true,
    opacity: 0.92,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
 
  const points = new THREE.Points(geometry, material);
  coreGroup.add(points);
 
  // soft inner glow (billboard sprite behind the dots)
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = glowCanvas.height = 256;
  const gctx = glowCanvas.getContext('2d');
  const grad = gctx.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0, 'rgba(255,195,234,0.42)');
  grad.addColorStop(0.5, 'rgba(198,110,220,0.14)');
  grad.addColorStop(1, 'rgba(154,60,180,0)');
  gctx.fillStyle = grad;
  gctx.fillRect(0,0,256,256);
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.SpriteMaterial({ map: glowTex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const glowSprite = new THREE.Sprite(glowMat);
  glowSprite.scale.set(4.6, 4.6, 1);
  coreGroup.add(glowSprite);
 
  // invisible hit-test sphere for click detection
  const hitGeo = new THREE.SphereGeometry(BASE_RADIUS + 0.35, 16, 16);
  const hitMat = new THREE.MeshBasicMaterial({ visible:false });
  const hitSphere = new THREE.Mesh(hitGeo, hitMat);
  coreGroup.add(hitSphere);
 
  // ---------------- interaction state ----------------
  let active = false;
  let targetZ = 6.2;
  let mouseX = 0, mouseY = 0;
 
  const raycaster = new THREE.Raycaster();
  const mouseVec = new THREE.Vector2();
 
  function onPointerMove(e){
    const cx = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
    const cy = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
    mouseX = (cx / window.innerWidth) * 2 - 1;
    mouseY = -(cy / window.innerHeight) * 2 + 1;
  }
  window.addEventListener('mousemove', onPointerMove);
 
  function setActive(state){
    active = state;
    document.body.classList.toggle('active', active);
    targetZ = active ? 7.1 : 6.2;
    document.getElementById('core-sub').textContent = active ? 'SELECT A MODULE' : 'TAP THE CORE TO INITIALIZE';
    document.getElementById('core-status').textContent = active ? 'AWAITING INPUT' : 'STANDBY';
    if (!active){
      document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
      document.getElementById('modules-linked').textContent = '0 / 3';
    }
  }
 
  function handleCoreClick(clientX, clientY){
    mouseVec.x = (clientX / window.innerWidth) * 2 - 1;
    mouseVec.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouseVec, camera);
    const hits = raycaster.intersectObject(hitSphere);
    if (hits.length > 0){
      setActive(!active);
    }
  }
 
  canvas.addEventListener('click', (e) => handleCoreClick(e.clientX, e.clientY));
 
  // option node selection
  document.querySelectorAll('.node').forEach(node => {
    node.addEventListener('click', () => {
      document.querySelectorAll('.node').forEach(n => n.classList.remove('selected'));
      node.classList.add('selected');
      document.getElementById('core-sub').textContent = node.dataset.name + ' — CONNECTED';
      document.getElementById('core-status').textContent = 'LINKED';
      document.getElementById('modules-linked').textContent = '1 / 3';
    });
  });
 
  // side panel buttons (Settings / Tasks)
  document.querySelectorAll('.side-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const wasSelected = btn.classList.contains('selected');
      document.querySelectorAll('.side-btn').forEach(b => b.classList.remove('selected'));
      if (!wasSelected) btn.classList.add('selected');
    });
  });

  // ---------------- resize ----------------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
 
  // ---------------- clock ----------------
  const clockEl = document.getElementById('clock');
  function tickClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    clockEl.innerHTML = `${hh}:${mm}:${ss}<br><span style="opacity:0.6">SYS. <b>ONLINE</b></span>`;
  }
  tickClock();
  setInterval(tickClock, 1000);
 
  // ---------------- animation loop ----------------
  const posAttr = geometry.attributes.position;
  const groundShadow = document.getElementById('ground-shadow');
  const clock = new THREE.Clock();
 
  function animate(){
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
 
    // per-dot levitation: gentle radius breathing per point
    for (let i = 0; i < COUNT; i++){
      const dx = baseDirs[i*3], dy = baseDirs[i*3+1], dz = baseDirs[i*3+2];
      const wobble = Math.sin(t * 1.1 + phases[i]) * 0.045;
      const r = BASE_RADIUS + wobble;
      posAttr.array[i*3]   = dx * r;
      posAttr.array[i*3+1] = dy * r;
      posAttr.array[i*3+2] = dz * r;
    }
    posAttr.needsUpdate = true;
 
    // continuous slow rotation
    coreGroup.rotation.y += active ? 0.0022 : 0.0014;
    coreGroup.rotation.x = Math.sin(t * 0.25) * 0.06;
 
    // whole-core levitation bob
    const bob = Math.sin(t * 0.6) * 0.14;
    coreGroup.position.y = bob;
 
    // subtle parallax toward mouse
    coreGroup.rotation.y += mouseX * 0.0003;
    coreGroup.rotation.x += mouseY * 0.0002;
 
    // camera ease toward target (zoom out slightly when menu is active)
    camera.position.z += (targetZ - camera.position.z) * 0.06;
 
    // ground shadow reacts to bob (levitation illusion)
    const shadowScale = 1 - bob * 0.6;
    groundShadow.style.transform = `translate(-50%, -50%) scale(${shadowScale.toFixed(3)})`;
    groundShadow.style.opacity = (0.85 - Math.abs(bob) * 0.9).toFixed(2);
 
    renderer.render(scene, camera);
  }
  animate();
 
})();
</script>
</body>
</html>
